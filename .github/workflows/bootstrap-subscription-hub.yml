name: Recover AVM Subscription Hub

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-subscription-hub.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble recovered project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 -d > /tmp/avm-subscription-hub.tar.xz
          echo "020a88738855b876d10660e32317fce6fd0310a2c18263d381bf00852e28d09a  /tmp/avm-subscription-hub.tar.xz" | sha256sum -c -
          tar -xJf /tmp/avm-subscription-hub.tar.xz -C .

      - name: Restore compressed evidence exactly
        shell: bash
        run: |
          set -euo pipefail
          xz -dkf evidence/avm-capacity.json.xz
          xz -dkf evidence/avm-churn.json.xz
          xz -dkf evidence/avm-lifecycle.json.xz
          rm evidence/avm-capacity.json.xz evidence/avm-churn.json.xz evidence/avm-lifecycle.json.xz
          echo "3e663b61d04ced78e7f56cef957a7fa1bf285d29036d3a9a6e50886dfab313fd  evidence/avm-capacity.json" | sha256sum -c -
          echo "79bf484d73dad4b18236dd9af0fa66f534312bc5bfbf29622ef7a2ef9841dfaf  evidence/avm-churn.json" | sha256sum -c -
          echo "606d85cdcadfab9d3bb329ae39ed735ac8440667f716c811d746cfdfe5d5beca  evidence/avm-lifecycle.json" | sha256sum -c -
          echo "1fbdef66fd98c299001828df37de204e14e31aa11be7279924fdb54e683db42e  vendor/avm-contract-sdk/src/lib.rs" | sha256sum -c -
          echo "cad4f25ec547ff0bf443032d0d017947e5c50b3972075845fa25e624fe6c8587  README.md" | sha256sum -c -

      - name: Rebuild vendored crates from Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal
          cp .cargo/config.toml /tmp/original-cargo-config.toml
          rm .cargo/config.toml
          rm -rf vendor/registry
          cargo +1.93.0 vendor vendor/registry > /tmp/generated-cargo-config.toml
          mv /tmp/original-cargo-config.toml .cargo/config.toml
          test -n "$(find vendor/registry -mindepth 1 -maxdepth 1 -type d -print -quit)"

      - name: Publish recovered tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-subscription-hub.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publish recovered AVM Subscription Hub project"
          git push origin HEAD:main
