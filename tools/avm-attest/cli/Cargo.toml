[package]
name = "avm-attest"
version = "0.1.0"
edition = "2021"

[dependencies]
attestation-protocol = { path = "../protocol" }
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
